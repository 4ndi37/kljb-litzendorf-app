{% extends "layout.html" %}
{% block title %}Protokoll bearbeiten – KLJB Litzendorf{% endblock %}

{% block content %}
<div class="main-content">

    <a href="{{ url_for('protokoll.archiv_aufklappen') }}" class="back-link">← Protokoll-Archiv</a>
    <div class="page-title"><i data-lucide="pencil" class="icon-lg"></i> Protokoll bearbeiten</div>

    <div class="card">
        <form action="{{ url_for('protokoll.protokoll_bearbeiten', id=protokoll.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="form-group">
                <label>Datum der Sitzung</label>
                <input type="date" name="datum" value="{{ protokoll.datum.isoformat() }}" required>
            </div>

            <div class="form-group">
                <label>Protokollführer</label>
                <input type="text" name="schreiber" value="{{ protokoll.schreiber or '' }}">
            </div>

            {% for punkt in protokoll.themen %}
            <div class="section-heading" style="margin-top:18px;">Punkt {{ loop.index }}</div>
            <div class="form-group">
                <label>Titel</label>
                <input type="text" name="titel_{{ punkt.id }}" value="{{ punkt.titel }}" required>
            </div>
            <div class="form-group">
                <label>Inhalt</label>
                <textarea name="inhalt_{{ punkt.id }}">{{ punkt.inhalt }}</textarea>
            </div>
            {% else %}
            <p class="text-muted text-sm" style="margin-top:12px;">Dieses Protokoll hat keine Punkte.</p>
            {% endfor %}

            <button type="submit" style="margin-top:8px;">Änderungen speichern</button>
        </form>
    </div>

</div>
{% endblock %}
