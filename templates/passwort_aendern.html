{% extends "layout.html" %}
{% block title %}Passwort ändern – KLJB Litzendorf{% endblock %}

{% block content %}
<div class="pw-wrapper">
    <div class="pw-box">
        <div class="page-title"><i data-lucide="key-round" class="icon-lg"></i> Passwort ändern</div>

        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="success-msg">{{ success }}</p>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="form-group">
                <label>Aktuelles Passwort</label>
                <input type="password" name="altes_passwort" required placeholder="Dein jetziges Passwort">
            </div>
            <div class="form-group">
                <label>Neues Passwort</label>
                <input type="password" name="neues_passwort" required placeholder="Neues, sicheres Passwort">
            </div>
            <div class="form-group">
                <label>Neues Passwort bestätigen</label>
                <input type="password" name="bestaetigung" required placeholder="Nochmal eintippen">
            </div>

            <button type="submit" class="btn-block">Passwort aktualisieren</button>
        </form>

        <div class="mt-2 text-center">
            <a href="/" class="back-link">← Zurück zur Startseite</a>
        </div>
    </div>
</div>
{% endblock %}
