{% extends 'layout.html' %}
{% block title %}404 – Seite nicht gefunden{% endblock %}

{% block content %}
<div class="main-content" style="text-align: center; padding-top: 60px;">
    <p style="font-size: 4rem; font-weight: 700; color: var(--text-white); line-height: 1;">404</p>
    <p class="page-title" style="margin-top: 12px;">Seite nicht gefunden</p>
    <p class="text-muted text-sm" style="margin-bottom: 28px;">Diese Seite existiert nicht oder wurde verschoben.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Zurück zur Startseite</a>
</div>
{% endblock %}
