{% extends "layout.html" %}
{% block title %}Neues Konzept – KLJB Litzendorf{% endblock %}

{% block content %}
<div class="main-content">

    <a href="/spiele_datenbank" class="back-link">← Spiele-Datenbank</a>
    <div class="page-title"><i data-lucide="square-pen" class="icon-lg"></i> Neues Basis-Konzept</div>

    <div class="card">
        <form action="/konzept_speichern" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="form-group">
                <label>Erstellt von</label>
                <div id="ms-leiter" class="ms-container"></div>
            </div>
            <div class="form-group">
                <label>Titel des Spiels</label>
                <input type="text" name="titel" placeholder="z.B. Capture the Flag" required>
            </div>
            <div class="form-group">
                <label>Beschreibung & Regeln</label>
                <textarea name="beschreibung" placeholder="Wie funktioniert das Spiel?"></textarea>
            </div>
            <div class="form-group">
                <label>Benötigtes Material</label>
                <input type="text" name="material" placeholder="z.B. 2 Flaggen, Absperrband">
            </div>

            <script src="{{ url_for('static', filename='js/multi_select.js') }}"></script>
            <script>
            (function() {
                const opts = [
                    {% for l in leiter_liste %}{"id": {{ l.id }}, "name": {{ l.name | tojson }}}{% if not loop.last %},{% endif %}
                    {% endfor %}
                ];
                window.leiterMs = new MultiSelect('ms-leiter', opts, 'leiter_ids', 'Name tippen...');
                window.leiterMs.preselectById([{{ current_user.id }}]);
            })();
            </script>

            <div style="display:flex;gap:10px;margin-top:4px;">
                <button type="submit">Speichern</button>
                <a href="/spiele_datenbank" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
